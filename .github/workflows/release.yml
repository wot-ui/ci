name: Release

# 只认完整版本号（v1.2.3 / v1.2.3-beta.1）。
# 旧 Action v0 标签保持在拆仓前版本；独立 Action 在 wot-ui/ci-action 发布。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"

      - run: pnpm lint
      - run: pnpm typecheck:all
      - run: pnpm build
      - run: pnpm test:run

  release:
    name: Publish npm
    needs: verify
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    with:
      publish: true
      # 只发 npm：release 由下面的 notes job 生成，
      # 因为这里拿不到 changelogithub 的 --from/--to 参数（原因见 notes job 的注释）
      github-release: false
    permissions:
      contents: write
      id-token: write

  notes:
    name: Publish GitHub release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # changelogithub v15 要求 Node ^22.19
          node-version: 22

      - name: Generate release notes for an explicit tag range
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # changelogithub 默认用 `git tag --points-at HEAD` 推断 --to：
          #   * 同一提交上挂多个 tag（比如移动后的 v0）时会得到 "v0\nv0.4.1" 这种多行 ref
          #   * 推断出 from == to 时静默生成 "0 commits / No significant changes"
          # v0.4.1 的 release notes 就是这么空的。这里显式给定区间，结果稳定可复现。
          if prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null); then
            echo "变更区间：$prev -> $TAG"
            npx --yes changelogithub@15 --from "$prev" --to "$TAG"
          else
            echo "没有上一个 tag，按首次发布处理：-> $TAG"
            npx --yes changelogithub@15 --to "$TAG"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,url --jq 'if .isDraft then error("Expected a published CLI release") else .url end'
