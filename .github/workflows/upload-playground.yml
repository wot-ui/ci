name: Upload Playground

# 用仓库内的 playground 项目端到端验证 wot-ui-ci：
#   1. 构建 CLI（dist）与 playground 小程序产物
#   2. 通过 uses: wot-ui/ci-action@v2.0.0 调用独立仓库的 Action，执行 doctor / --dry-run 校验
#   3. 按选择执行上传或预览，存档 JSON、二维码、环境记录与 Job Summary
#
# push 到 main 时只跑 dry-run 冒烟测试，避免每个提交都占用一个上传版本。

on:
  workflow_dispatch:
    inputs:
      command:
        description: Capability to validate
        required: true
        default: upload
        type: choice
        options:
          - upload
          - preview
      platform:
        description: Target platform
        required: true
        default: weixin
        type: choice
        options:
          - weixin
          - alipay
          - dingtalk
      version:
        description: Upload version (defaults to playground/package.json)
        required: false
        type: string
      desc:
        description: Upload description (defaults to "playground <commit>")
        required: false
        type: string
      robot:
        description: WeChat CI robot number (1-30)
        required: false
        default: '1'
        type: string
      dry_run:
        description: Only validate locally, do not upload or preview
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'playground/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/upload-playground.yml

permissions:
  contents: read

# 按事件类型分组：push 触发的 dry-run 可以被新提交取代，手动上传之间只排队不取消
concurrency:
  group: upload-playground-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  upload:
    name: Playground ${{ inputs.command || 'upload' }} (${{ (github.event_name == 'push' || inputs.dry_run) && 'dry-run' || 'real' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EVENT_NAME: ${{ github.event_name }}
      WOTCI_VERSION: ${{ inputs.version }}
      WOTCI_DESC: ${{ inputs.desc }}
      WEIXIN_PROJECT_PATH: dist/build/mp-weixin
      ALIPAY_PROJECT_PATH: dist/build/mp-alipay
      ALIPAY_AUTOINCREMENT: ${{ secrets.ALIPAY_AUTOINCREMENT }}
      DINGTALK_PROJECT_PATH: ${{ secrets.DINGTALK_PROJECT_PATH || 'dist/build/mp-alipay' }}
      DINGTALK_AUTOINCREMENT: ${{ secrets.DINGTALK_AUTOINCREMENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # 不能加 --ignore-scripts：esbuild 等依赖的安装脚本被跳过会导致 playground 构建失败
        run: pnpm install --frozen-lockfile

      - name: Resolve run inputs
        id: inputs
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ROBOT: ${{ inputs.robot }}
        run: |
          set -euo pipefail

          platform="${INPUT_PLATFORM:-weixin}"
          case "$platform" in
            weixin|alipay|dingtalk) ;;
            *) echo "::error::不支持的平台：$platform"; exit 1 ;;
          esac

          command="${INPUT_COMMAND:-upload}"
          case "$command" in
            upload|preview) ;;
            *) echo "::error::不支持的命令：$command"; exit 1 ;;
          esac
          if [ "$command" = "preview" ] && [ "$platform" = "dingtalk" ]; then
            echo "::error::钉钉未接入 preview，请选择 upload"
            exit 1
          fi

          dry_run="${INPUT_DRY_RUN:-false}"
          if [ "$EVENT_NAME" = "push" ]; then
            dry_run="true"
          fi

          robot="${INPUT_ROBOT:-1}"
          case "$robot" in
            ''|*[!0-9]*) echo "::error::robot 必须是 1-30 的数字，当前：$robot"; exit 1 ;;
          esac
          if [ "$robot" -lt 1 ] || [ "$robot" -gt 30 ]; then
            echo "::error::robot 必须在 1-30 之间，当前：$robot"; exit 1
          fi

          {
            echo "COMMAND=$command"
            echo "PLATFORM=$platform"
            echo "DRY_RUN=$dry_run"
            echo "WEIXIN_ROBOT=$robot"
            echo "WEIXIN_PRIVATE_KEY_PATH=${RUNNER_TEMP}/weixin.private.key"
            echo "ALIPAY_PRIVATE_KEY_PATH=${RUNNER_TEMP}/alipay.private.key"
          } >> "$GITHUB_ENV"

          # 没有显式描述时带上提交号，方便在微信后台区分每次 playground 上传
          if [ -z "${WOTCI_DESC:-}" ]; then
            commit="${GITHUB_SHA:-local}"
            echo "WOTCI_DESC=playground ${commit:0:7}" >> "$GITHUB_ENV"
          fi

          {
            echo "command=$command"
            echo "platform=$platform"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

          echo "command=$command platform=$platform dry-run=$dry_run robot=$robot"

      - name: Build CLI
        run: pnpm build

      - name: Use workspace CLI in the action
        # working-directory 为 playground；显式绑定本次构建，避免回退到 npm 上的版本。
        run: |
          mkdir -p playground/node_modules/.bin
          cat > playground/node_modules/.bin/wotci <<'EOF'
          #!/usr/bin/env bash
          exec node "${GITHUB_WORKSPACE}/dist/bin.mjs" "$@"
          EOF
          chmod +x playground/node_modules/.bin/wotci

      - name: Build playground
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            weixin) target=mp-weixin ;;
            alipay|dingtalk) target=mp-alipay ;;
          esac
          pnpm --dir playground "build:$target"

      - name: Prepare upload credentials
        env:
          WEIXIN_APPID_SECRET: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_PRIVATE_KEY: ${{ secrets.WEIXIN_PRIVATE_KEY }}
          ALIPAY_APPID_SECRET: ${{ secrets.ALIPAY_APPID }}
          ALIPAY_TOOL_ID_SECRET: ${{ secrets.ALIPAY_TOOL_ID }}
          ALIPAY_PRIVATE_KEY_SECRET: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          ALIPAY_CLIENT_TYPE_SECRET: ${{ secrets.ALIPAY_CLIENT_TYPE }}
          DINGTALK_APPID_SECRET: ${{ secrets.DINGTALK_APPID }}
          DINGTALK_TOKEN_SECRET: ${{ secrets.DINGTALK_TOKEN }}
        run: |
          set -euo pipefail

          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::缺少 $name secret，无法执行 $PLATFORM 上传"
              exit 1
            fi
          }

          case "$PLATFORM" in
            weixin)
              if [ -z "${WEIXIN_APPID_SECRET:-}" ]; then
                if [ "$DRY_RUN" = "true" ]; then
                  echo "::warning title=Missing secret::WEIXIN_APPID 未配置，dry-run 使用占位 appid"
                  echo "WEIXIN_APPID=wx0000000000000000" >> "$GITHUB_ENV"
                else
                  echo "::error::缺少 WEIXIN_APPID secret，无法执行微信上传"
                  exit 1
                fi
              else
                echo "WEIXIN_APPID=${WEIXIN_APPID_SECRET}" >> "$GITHUB_ENV"
              fi

              if [ -n "${WEIXIN_PRIVATE_KEY:-}" ]; then
                printf '%s' "$WEIXIN_PRIVATE_KEY" | tr -d '\r' > "$WEIXIN_PRIVATE_KEY_PATH"
              elif [ "$DRY_RUN" = "true" ]; then
                echo "::warning title=Missing secret::WEIXIN_PRIVATE_KEY 未配置，dry-run 使用临时测试私钥"
                openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$WEIXIN_PRIVATE_KEY_PATH" >/dev/null 2>&1
              else
                echo "::error::缺少 WEIXIN_PRIVATE_KEY secret，无法执行微信上传"
                exit 1
              fi
              chmod 600 "$WEIXIN_PRIVATE_KEY_PATH"
              if ! grep -q -- '-----BEGIN' "$WEIXIN_PRIVATE_KEY_PATH" \
                || ! grep -q -- '-----END' "$WEIXIN_PRIVATE_KEY_PATH"; then
                echo "::error::WEIXIN_PRIVATE_KEY 不是完整的 PEM，请确认使用的是小程序代码上传密钥"
                exit 1
              fi
              ;;
            alipay)
              require ALIPAY_APPID "${ALIPAY_APPID_SECRET:-}"
              require ALIPAY_TOOL_ID "${ALIPAY_TOOL_ID_SECRET:-}"
              require ALIPAY_PRIVATE_KEY "${ALIPAY_PRIVATE_KEY_SECRET:-}"
              printf '%s' "$ALIPAY_PRIVATE_KEY_SECRET" | tr -d '\r' > "$ALIPAY_PRIVATE_KEY_PATH"
              chmod 600 "$ALIPAY_PRIVATE_KEY_PATH"
              if ! grep -q -- '-----BEGIN' "$ALIPAY_PRIVATE_KEY_PATH"; then
                echo "::error::ALIPAY_PRIVATE_KEY 不是 PEM 格式"
                exit 1
              fi
              echo "ALIPAY_APPID=${ALIPAY_APPID_SECRET}" >> "$GITHUB_ENV"
              echo "ALIPAY_TOOL_ID=${ALIPAY_TOOL_ID_SECRET}" >> "$GITHUB_ENV"
              echo "ALIPAY_PRIVATE_KEY_PATH=${ALIPAY_PRIVATE_KEY_PATH}" >> "$GITHUB_ENV"
              if [ -n "${ALIPAY_CLIENT_TYPE_SECRET:-}" ]; then
                echo "ALIPAY_CLIENT_TYPE=${ALIPAY_CLIENT_TYPE_SECRET}" >> "$GITHUB_ENV"
              fi
              ;;
            dingtalk)
              require DINGTALK_APPID "${DINGTALK_APPID_SECRET:-}"
              require DINGTALK_TOKEN "${DINGTALK_TOKEN_SECRET:-}"
              echo "DINGTALK_APPID=${DINGTALK_APPID_SECRET}" >> "$GITHUB_ENV"
              printf 'DINGTALK_TOKEN<<WOTCI_EOF\n%s\nWOTCI_EOF\n' "$DINGTALK_TOKEN_SECRET" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Doctor
        uses: wot-ui/ci-action@v2.0.0
        with:
          command: doctor
          working-directory: playground
          config: wotci.config.ts

      - name: Doctor network check
        # 仅作为诊断：微信上传要求 IP 在白名单内，但网络校验失败不应阻塞真实上传
        if: ${{ steps.inputs.outputs.dry_run != 'true' }}
        timeout-minutes: 5
        id: network
        continue-on-error: true
        working-directory: playground
        run: ./node_modules/.bin/wotci doctor --config wotci.config.ts --network

      - name: Report network diagnostic failure
        if: ${{ steps.network.outcome == 'failure' }}
        run: echo '::warning title=Network check failed::doctor --network 未通过，请查看诊断日志；继续执行所选命令。'

      - name: Capability plan (dry-run)
        id: plan
        timeout-minutes: 5
        uses: wot-ui/ci-action@v2.0.0
        with:
          command: ${{ steps.inputs.outputs.command }}
          working-directory: playground
          config: wotci.config.ts
          platform: ${{ steps.inputs.outputs.platform }}
          dry-run: 'true'
          json-output: ${{ runner.temp }}/plan.json
          summary: ${{ runner.temp }}/plan-summary.md

      - name: Upload
        id: upload
        if: ${{ steps.inputs.outputs.dry_run != 'true' && steps.inputs.outputs.command == 'upload' }}
        timeout-minutes: 15
        uses: wot-ui/ci-action@v2.0.0
        with:
          command: upload
          working-directory: playground
          config: wotci.config.ts
          platform: ${{ steps.inputs.outputs.platform }}
          json-output: ${{ runner.temp }}/upload.json
          summary: ${{ runner.temp }}/upload-summary.md

      - name: Preview
        id: preview
        if: ${{ steps.inputs.outputs.dry_run != 'true' && steps.inputs.outputs.command == 'preview' }}
        timeout-minutes: 15
        uses: wot-ui/ci-action@v2.0.0
        with:
          command: preview
          working-directory: playground
          config: wotci.config.ts
          platform: ${{ steps.inputs.outputs.platform }}
          qrcode-output: ${{ runner.temp }}/preview.png
          json-output: ${{ runner.temp }}/preview.json
          summary: ${{ runner.temp }}/preview-summary.md

      - name: Record validation context
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'

          function version(file) {
            try { return JSON.parse(readFileSync(file, 'utf8')).version ?? null }
            catch { return null }
          }
          const env = process.env
          const context = {
            schemaVersion: 1,
            recordedAt: new Date().toISOString(),
            commit: env.GITHUB_SHA,
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            runAttempt: env.GITHUB_RUN_ATTEMPT,
            event: env.EVENT_NAME,
            command: env.COMMAND ?? null,
            platform: env.PLATFORM ?? null,
            mode: env.DRY_RUN === 'true' ? 'dry-run' : env.DRY_RUN === 'false' ? 'real' : 'unknown',
            projectType: env.PLATFORM === 'weixin' ? 'miniProgram' : null,
            cliVersion: version('package.json'),
            node: process.version,
            os: { platform: process.platform, arch: process.arch, release: os.release(), runnerImage: env.ImageOS ?? null, runnerImageVersion: env.ImageVersion ?? null },
            sdks: Object.fromEntries(['miniprogram-ci', 'minidev', 'dingtalk-miniapp-opensdk'].map(name => [name, version(`node_modules/${name}/package.json`)])),
            outcomes: { plan: env.PLAN_OUTCOME, upload: env.UPLOAD_OUTCOME, preview: env.PREVIEW_OUTCOME },
          }
          // 仅写上述允许字段，不保存凭证、完整配置或整个环境变量。
          writeFileSync(path.join(env.RUNNER_TEMP, 'validation-context.json'), `${JSON.stringify(context, null, 2)}\n`)
          NODE

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          platform="${PLATFORM:-weixin}"
          command="${COMMAND:-upload}"
          dry_run="${DRY_RUN:-unknown}"
          case "$dry_run" in
            true) mode='dry-run（仅本地校验）' ;;
            false) mode='真实平台调用（是否完成见步骤结果）' ;;
            *) mode='未解析，见输入步骤错误' ;;
          esac
          event_name="${EVENT_NAME:-unknown}"
          version="${WOTCI_VERSION:-$(node -p "require('./playground/package.json').version")}"
          desc="${WOTCI_DESC:-$(node -p "require('./playground/package.json').description || ''")}"

          {
            echo "## Playground 能力验证"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 平台 | $platform |"
            echo "| 命令 | $command |"
            echo "| 模式 | $mode |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Node | $(node --version) |"
            echo "| 触发方式 | $event_name |"
            echo "| CLI 版本 | $(node -p "require('./package.json').version") |"
            echo "| 版本 | $version |"
            echo "| 描述 | $desc |"
            echo "| dry-run 校验 | ${{ steps.plan.outcome }} |"
            echo "| 上传 | ${{ steps.upload.outcome }} |"
            echo "| 预览 | ${{ steps.preview.outcome }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # 找不到真实结果时展示 plan，但不能把本地校验当作平台调用成功。
          summary_file="$RUNNER_TEMP/$command-summary.md"
          if [ "$dry_run" = "true" ] || [ ! -s "$summary_file" ]; then
            summary_file="$RUNNER_TEMP/plan-summary.md"
          fi
          if [ -s "$summary_file" ]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$dry_run" != "true" ] && [ ! -s "$RUNNER_TEMP/$command-summary.md" ]; then
            echo "> 平台调用未生成 summary；上方 plan 仅代表本地校验，请查看 Upload / Preview 步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "> 环境与 SDK 精确版本见 artifact 中的 validation-context.json；扫码验收需另外记录。" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-upload-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/plan-summary.md
            ${{ runner.temp }}/upload.json
            ${{ runner.temp }}/upload-summary.md
            ${{ runner.temp }}/preview.json
            ${{ runner.temp }}/preview-summary.md
            ${{ runner.temp }}/preview.png
            ${{ runner.temp }}/validation-context.json
            playground/dist/build/mp-weixin/project.config.json
            playground/dist/build/mp-alipay/project.config.json

      - name: Remove private keys
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/weixin.private.key" "${RUNNER_TEMP}/alipay.private.key"
