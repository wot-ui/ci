name: Website

on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - README.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/website.yml
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'docs/**'
      - README.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:test
      - run: pnpm site:build
      - run: pnpm site:typecheck
      - run: pnpm site:test:build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-website
          include-hidden-files: true
          path: |
            apps/website/.next/
            apps/website/public/
          if-no-files-found: error
