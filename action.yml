name: wot-ui-ci
description: Legacy Wot CI Action. For new workflows use wot-ui/ci-action. Existing inputs remain compatible.
author: wot-ui

branding:
  icon: upload-cloud
  color: blue

inputs:
  command:
    description: CLI command, e.g. upload, preview, release, doctor, build-npm, sourcemap, inspect, quality
    required: false
    default: upload
  platform:
    description: Target platform(s), comma separated. Example weixin,alipay
    required: false
    default: ''
  config:
    description: Optional config file path. Omit to use direct upload inputs or auto-discover project config
    required: false
    default: ''
  project-path:
    description: Built mini-program directory, relative to working-directory. Enables config-free mode
    required: false
    default: ''
  appid:
    description: App ID for the selected platform. Falls back to WEIXIN_APPID, ALIPAY_APPID or DINGTALK_APPID
    required: false
    default: ''
  private-key:
    description: WeChat or Alipay private key text, normally from secrets. Mutually exclusive with private-key-path
    required: false
    default: ''
  private-key-path:
    description: Existing WeChat or Alipay private key file, relative to working-directory
    required: false
    default: ''
  upload-version:
    description: Upload version. Falls back to WOTCI_VERSION, then package.json version
    required: false
    default: ''
  upload-desc:
    description: Upload description. Falls back to WOTCI_DESC, then package.json description
    required: false
    default: ''
  robot:
    description: WeChat CI robot number (1-30). Falls back to WEIXIN_ROBOT, then 1
    required: false
    default: ''
  tool-id:
    description: Alipay open-platform tool ID. Falls back to ALIPAY_TOOL_ID
    required: false
    default: ''
  token:
    description: DingTalk API token, normally from secrets. Falls back to DINGTALK_TOKEN
    required: false
    default: ''
  setting:
    description: WeChat compiler settings as a JSON object (e.g. {"minifyJS":true}). Falls back to WEIXIN_SETTING
    required: false
    default: ''
  preview:
    description: Platform preview configuration as a JSON object. Falls back to WEIXIN_PREVIEW or ALIPAY_PREVIEW
    required: false
    default: ''
  platform-options:
    description: Optional platform configuration as a JSON object, excluding credentials and projectPath. Falls back to WEIXIN_OPTIONS, ALIPAY_OPTIONS or DINGTALK_OPTIONS
    required: false
    default: ''
  working-directory:
    description: Directory to run the CLI in
    required: false
    default: .
  summary:
    description: Markdown summary file. Typically $GITHUB_STEP_SUMMARY
    required: false
    default: ''
  json:
    description: Print JSON to stdout
    required: false
    default: 'false'
  json-output:
    description: Save CLI JSON stdout to this file (relative to working-directory). Enables json and preserves CLI failures
    required: false
    default: ''
  dry-run:
    description: Validate config without calling SDK
    required: false
    default: 'false'
  network:
    description: Run doctor network checks
    required: false
    default: 'false'
  yes:
    description: Confirm destructive operations such as version delete
    required: false
    default: 'false'
  version:
    description: Target app version for experience / version delete
    required: false
    default: ''
  pr-comment:
    description: auto, true or false. Only applies to release
    required: false
    default: auto
  history:
    description: auto, true or false. Only applies to release
    required: false
    default: auto
  args:
    description: Extra CLI arguments, space separated
    required: false
    default: ''
  package-version:
    description: >-
      @wot-ui/ci version used via npx when the project does not have it installed.
      Empty means: use the version of the action ref (uses wot-ui/ci@v0.4.1 -> 0.4.1),
      falling back to latest for moving refs such as v0 or main
    required: false
    default: ''
  registry:
    description: CLI installation registry. Empty uses npm_config_registry / NPM_CONFIG_REGISTRY, then https://registry.npmjs.org/. Does not change project dependency installation
    required: false
    default: ''
  install-dependencies:
    description: Run package manager install before wotci
    required: false
    default: 'false'
  node-version:
    description: Node.js version used by actions/setup-node
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Prepare CLI cache
      id: wotci-cache-config
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        WOTCI_ACTION_REF: ${{ github.action_ref }}
      run: node "${{ github.action_path }}/scripts/github-action-cache.mjs"

    - name: Restore CLI cache
      id: wotci-cache
      if: ${{ steps.wotci-cache-config.outputs.enabled == 'true' }}
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |
          ${{ steps.wotci-cache-config.outputs.path }}/_cacache
          ${{ steps.wotci-cache-config.outputs.path }}/_npx
        key: ${{ steps.wotci-cache-config.outputs.key }}

    - name: Run wot-ui-ci
      id: wotci-run
      shell: bash
      env:
        WOTCI_ACTION_REF: ${{ github.action_ref }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_APPID: ${{ inputs.appid }}
        INPUT_PRIVATE_KEY: ${{ inputs.private-key }}
        INPUT_PRIVATE_KEY_PATH: ${{ inputs.private-key-path }}
        INPUT_UPLOAD_VERSION: ${{ inputs.upload-version }}
        INPUT_UPLOAD_DESC: ${{ inputs.upload-desc }}
        INPUT_ROBOT: ${{ inputs.robot }}
        INPUT_TOOL_ID: ${{ inputs.tool-id }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SETTING: ${{ inputs.setting }}
        INPUT_PREVIEW: ${{ inputs.preview }}
        INPUT_PLATFORM_OPTIONS: ${{ inputs.platform-options }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_NETWORK: ${{ inputs.network }}
        INPUT_YES: ${{ inputs.yes }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        WOTCI_NPM_CACHE: ${{ steps.wotci-cache-config.outputs.path }}
        INPUT_INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
      run: bash "${{ github.action_path }}/scripts/github-action.sh"

    - name: Save CLI cache
      if: ${{ always() && !cancelled() && steps.wotci-run.outputs.cli-cache-ready == 'true' && steps.wotci-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          ${{ steps.wotci-cache-config.outputs.path }}/_cacache
          ${{ steps.wotci-cache-config.outputs.path }}/_npx
        key: ${{ steps.wotci-cache-config.outputs.key }}
